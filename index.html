function toolbar(){const currentReasons=[...new Set([...REASONS,...activeRecords().flatMap(n=>n.reasons)])];return `<div class="toolbar">${state.page!=='subject'?`<div class="chips" aria-label="按学科筛选">${[{id:'all',name:'全部'},...visibleFolders()].map(s=>`<button class="chip ${state.subject===s.id?'active':''}" aria-pressed="${state.subject===s.id}" data-action="subject-filter" data-id="${s.id}">${esc(s.name)}</button>`).join('')}</div>`:`<div class="status-filter">${[['all','全部记录'],['pending','待复习'],['mastered','已掌握']].map(([id,label])=>`<button data-action="status-filter" data-id="${id}" class="${state.status===id?'active':''}">${label}</button>`).join('')}</div>`}<div class="filter-actions"><select class="filter-select" id="reason-filter" aria-label="按错误原因筛选"><option value="all">所有错误原因</option>${currentReasons.map(r=>`<option ${state.reason===r?'selected':''} value="${esc(r)}">${esc(r)}</option>`).join('')}</select>${state.view!=='timeline'&&state.page!=='timeline'?`<select class="filter-select" id="time-filter" aria-label="按记录时间筛选">${[['all','全部时间'],['day','今天'],['week','本周'],['month','本月']].map(([v,t])=>`<option value="${v}" ${state.time===v?'selected':''}>${t}</option>`).join('')}</select>`:''}<button class="icon-btn" data-action="search" aria-label="搜索错题">${icon('search')}</button></div></div>`;}
function paper(n){return `<div class="paper"><div class="paper-text">${esc(n.paper||n.title)}</div><div class="paper-red">${esc(n.example?'↳ '+n.notes:'认真记录，慢慢想明白。')}</div></div>`;}
function noteCard(n){const s=subjectOf(n.subject);return `<button class="note-card" data-action="detail" data-id="${n.id}" style="${colors(s)}" aria-label="查看错题：${esc(n.title)}"><div class="note-preview"><span class="subject-pill">${esc(s.name)}</span>${n.mastered?'<span class="mastered-pill">已掌握</span>':''}${n.photo?`<img src="${n.photo}" alt="${esc(n.title)}的题目照片" loading="lazy">`:paper(n)}</div><div class="note-body"><h3 class="note-title">${esc(n.title)}</h3><div class="reason-tags">${n.reasons.slice(0,2).map(r=>`<span class="reason-tag">${esc(r)}</span>`).join('')}${n.reasons.length>2?`<span class="reason-tag">+${n.reasons.length-2}</span>`:''}</div><div class="note-meta"><span class="note-meta-date">${icon('clock')}${relativeLabel(n.createdAt)}</span>${icon('arrow')}</div></div></button>`;}
function noteGrid(notes){return `<div class="note-grid">${notes.length?notes.map(noteCard).join(''):emptyState()}</div>`;}
function emptyState(){const hasFilters=state.reason!=='all'||state.query||state.status!=='all'||state.time!=='all';return `<div class="empty-state"><div class="empty-icon">${icon(hasFilters?'search':'book')}</div><h3>${hasFilters?'还没有符合条件的错题':'把第一道错题留在这里'}</h3><p>${hasFilters?'换一个关键词或筛选条件，再找找看。':'不急着学会所有答案，从记录一个疑问开始。'}</p>${hasFilters?'<button class="secondary" data-action="clear-filters">清除筛选</button>':'<button class="primary" data-action="camera">'+icon('camera')+' 拍下第一道错题</button>'}</div>`;}
function foldersPage(){return '<div class="page-head"><div class="page-title-row"><div><p class="eyebrow">YOUR COLLECTION</p><h1>让知识，各就其位。</h1><p class="page-description">按你的方式收藏，装下每一次思考。'+(state.demo?'当前展示示例内容。':'')+'</p></div><div class="page-actions"><button class="secondary" data-action="manage-folders">'+icon('folder')+' 管理收藏夹</button><button class="primary" data-action="camera">'+icon('plus')+' 记录错题</button></div></div></div>'+(folders.length?'<div class="full-folders">'+folders.map(s=>folder(s,true)).join('')+'</div>':'<div class="folders-empty"><span class="empty-icon">'+icon('folder')+'</span><h2>给下一次进步，留一个位置。</h2><p>自定义名称，或从九门学科中快捷添加。</p><button class="primary" data-action="manage-folders">'+icon('plus')+' 添加收藏夹</button></div>')+unfiledLink();}
function collectionPage(){const s=state.page==='subject'?subjectOf(state.subject):null;const list=filtered();return `<div class="page-head"><button class="back-btn" data-action="navigate" data-page="${s?'folders':'home'}">${icon('back')}${s?'所有收藏夹':'返回首页'}</button><div class="page-title-row"><div><p class="eyebrow">${s?'SUBJECT COLLECTION':'EVERY QUESTION MATTERS'}</p><div class="records-title"><h1>${s?esc(s.name)+'收藏夹':'所有错题'}</h1>${demoBadge()}</div><p class="page-description">${s?'在每一次回看里，让 '+esc(s.name)+' 更清晰。':'每一个疑问，都值得一个认真想明白的答案。'}</p></div><div class="page-actions"><button class="secondary" data-action="manage-folders">${icon('folder')} 管理收藏夹</button><button class="primary" data-action="camera">${icon('plus')} 记录错题</button></div></div></div><div class="records-heading"><span class="all-count">${list.length} 道记录</span><div class="segmented"><button data-action="view" data-id="grid" class="${state.view==='grid'?'active':''}">${icon('grid')} 卡片视图</button><button data-action="view" data-id="timeline" class="${state.view==='timeline'?'active':''}">${icon('clock')} 时间视图</button></div></div>${state.search?searchBar():''}${toolbar()}${state.view==='timeline'?timeline():noteGrid(list.slice(0,state.limit))}${state.view==='grid'&&list.length>state.limit?'<div class="more-row"><button class="secondary" data-action="load-more">加载更多</button></div>':''}`;}
function timelinePage(){return `<div class="page-head"><div class="page-title-row"><div><p class="eyebrow">A TIMELINE OF GROWTH</p><h1>每一步，都有迹可循。</h1><p class="page-description">把时间拉近或拉远，看看自己一路走来的积累。</p></div>${demoBadge()}</div></div>${state.search?searchBar():''}${toolbar()}${timeline()}`;}
function timeline(){const notes=filterNotes(activeRecords(),{...state,time:'all',folders}).filter(n=>inPeriod(n,state.date,state.period));const {start,end}=periodBounds(state.date,state.period);let label=state.period==='day'?`${start.getMonth()+1}月${start.getDate()}日`:state.period==='month'?`${start.getFullYear()}年${start.getMonth()+1}月`:`${dayLabel(start)} — ${dayLabel(new Date(end.getTime()-1))}`;return `<section class="timeline-panel"><div class="timeline-controls"><div class="segmented" aria-label="时间范围">${[['day','日'],['week','周'],['month','月']].map(([id,t])=>`<button data-action="period" data-id="${id}" class="${state.period===id?'active':''}" aria-pressed="${state.period===id}">${t}</button>`).join('')}</div><div class="date-navigator"><button class="icon-btn" data-action="prev-date" aria-label="上一个时间段">${icon('back')}</button><input type="date" id="timeline-date" value="${state.date}" aria-label="选择时间轴日期"><button class="icon-btn" data-action="next-date" aria-label="下一个时间段">${icon('arrow')}</button><button class="today-btn" data-action="today">今天</button></div></div><div class="timeline-summary"><strong>${notes.length}</strong> 道错题 <span>· ${label}</span></div>${state.period==='day'?dayTimeline(notes):state.period==='week'?weekTimeline(notes,start):monthTimeline(notes,start)}${state.period==='month'?'<div class="month-hint">点击日期，查看当天每个小时的记录。</div>':''}</section>`;}
function dayTimeline(notes){if(!notes.length)return `<div class="empty-state"><div class="empty-icon">${icon('calendar')}</div><h3>这一天，还没有留下记录</h3><p>可以选择其他日期，或记录一道新的错题。</p><button class="primary" data-action="camera">${icon('plus')} 记录错题</button></div>`;const groups=new Map();for(const n of [...notes].sort((a,b)=>new Date(a.createdAt)-new Date(b.createdAt))){const h=new Date(n.createdAt).getHours();if(!groups.has(h))groups.set(h,[]);groups.get(h).push(n);}return `<div class="day-timeline">${[...groups.entries()].map(([h,list])=>`<div class="hour-row"><time class="hour-label">${String(h).padStart(2,'0')}:00</time><div class="hour-content has-notes">${list.map(n=>{const s=subjectOf(n.subject);return `<button class="timeline-note" data-action="detail" data-id="${n.id}" style="${colors(s)}"><span class="tiny-subject">${esc(s.name)}</span><span class="timeline-note-title">${esc(n.title)}</span><span class="reason-tag">${esc(n.reasons[0])}</span><time>${timeLabel(n.createdAt)}</time>${icon('arrow')}</button>`;}).join('')}</div></div>`).join('')}</div>`;}
function weekTimeline(notes,start){return `<div class="week-grid">${Array.from({length:7},(_,i)=>{const d=new Date(start);d.setDate(d.getDate()+i);const key=localDate(d),list=notes.filter(n=>localDate(new Date(n.createdAt))===key);return `<div class="week-day ${key===localDate()?'is-today':''}"><button class="week-day-head" style="width:100%" data-action="day" data-id="${key}" aria-label="查看${dayLabel(d)}记录"><span>周${'一二三四五六日'[i]}</span><strong>${d.getDate()}</strong></button>${list.length?list.map(n=>{const s=subjectOf(n.subject);return `<button class="week-item" data-action="detail" data-id="${n.id}" style="${colors(s)}"><span>${esc(n.title)}</span><time>${timeLabel(n.createdAt)} · ${esc(s.name)}</time></button>`;}).join(''):'<div class="week-no">暂无记录</div>'}</div>`;}).join('')}</div>`;}
function monthTimeline(notes,start){const offset=(start.getDay()+6)%7;const last=new Date(start.getFullYear(),start.getMonth()+1,0).getDate();return `<div class="month-grid">${[...'一二三四五六日'].map(x=>`<div class="month-weekday">${x}</div>`).join('')}${'<div class="month-blank"></div>'.repeat(offset)}${Array.from({length:last},(_,i)=>{const d=new Date(start);d.setDate(i+1);const key=localDate(d),list=notes.filter(n=>localDate(new Date(n.createdAt))===key),subjects=[...new Set(list.map(n=>n.subject))];return `<button class="month-cell ${list.length?'has-records':''} ${key===localDate()?'is-today':''}" data-action="day" data-id="${key}" aria-label="${dayLabel(d)}，${list.length}道错题"><span class="day-number">${i+1}</span>${list.length?`<span class="month-dots">${subjects.map(s=>`<i style="background:${subjectOf(s).color}"></i>`).join('')}</span><span class="month-count">${list.length} 道记录</span>`:''}</button>`;}).join('')}</div>`;}
function render(){app.innerHTML=header()+`<main class="container main-page animate">${storageError?`<div class="notice">${esc(storageError)}</div>`:''}${state.page==='home'?home():state.page==='folders'?foldersPage():state.page==='timeline'?timelinePage():collectionPage()}</main>`+footer();syncQuoteRotation();}
function modal(title,subtitle,content,actions='',classes=''){if(!overlay.innerHTML)lastFocus=document.activeElement;overlay.innerHTML=`<div class="modal-backdrop"><section class="modal ${classes}" role="dialog" aria-modal="true" aria-labelledby="modal-title"><header class="modal-head"><div><h2 id="modal-title">${title}</h2>${subtitle?`<p>${subtitle}</p>`:''}</div><button class="icon-btn" data-action="close-modal" aria-label="关闭弹窗">${icon('close')}</button></header>${content}${actions?`<footer class="modal-actions">${actions}</footer>`:''}</section></div>`;document.body.style.overflow='hidden';requestAnimationFrame(()=>overlay.querySelector('[autofocus],button,input')?.focus());}
function stopCamera(){cameraToken++;if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}}
function closeModal(force=false){if(busy&&!force)return;if(imageExportCleanup){imageExportCleanup();imageExportCleanup=null;}photoRequestId++;if(cropCleanup){cropCleanup();cropCleanup=null;}settingsOpen=false;stopCamera();overlay.innerHTML='';document.body.style.overflow='';draft=null;restorePending=null;lastFocus?.focus?.();}
function createDraft(photo=''){const existingSubject=state.subject!=='all'?state.subject:'';draft={id:null,title:'',subject:existingSubject,reasons:[],notes:'',createdAt:localInput(),mastered:false,photo};openEditor();}
function readDraft(){if(!draft)return;const form=document.querySelector('#note-form');if(form){draft.title=form.elements.title.value;draft.notes=form.elements.notes.value;draft.createdAt=form.elements.createdAt.value;}}
function openEditor(error=''){const n=draft;const allReasons=[...new Set([...REASONS,...n.reasons])];modal(n.id?'编辑这道错题':'给这道错题，找到位置。',n.id?'每一次补充，都是一次新的理解。':'选好收藏夹与错误原因，方便下一次回看。',`<div class="modal-content"><form id="note-form"><div class="editor-layout"><div><div class="editor-photo">${n.photo?`<img src="${n.photo}" alt="待归档的错题照片">`:`<div class="photo-placeholder">${icon('image')}<span>也可以只用文字记录</span></div>`}</div><div class="photo-actions">${n.photo?`<button type="button" data-action="crop-photo">${icon('crop')} 裁切照片</button>`:''}<button type="button" data-action="replace-photo">${icon('image')} ${n.photo?'更换题目照片':'添加题目照片'}</button></div><p class="file-note" style="text-align:center">支持 JPG、PNG、WebP，照片会自动压缩。</p></div><div>${error?`<p class="form-error" role="alert">${esc(error)}</p>`:''}<div class="form-field"><label for="note-title">题目名称 <span style="color:#adb7c5">· 便于查找</span></label><input id="note-title" name="title" required maxlength="100" placeholder="例如：一元二次方程的配方法" value="${esc(n.title)}"></div><div class="form-field"><span class="field-label">所属收藏夹 <span style="color:#df8e8e">*</span></span><div class="form-subjects">${[...folders,UNFILED].map(s=>`<button type="button" class="select-chip ${n.subject===s.id?'selected':''}" data-action="draft-subject" data-id="${s.id}" aria-pressed="${n.subject===s.id}">${esc(s.name)}</button>`).join('')}</div></div><div class="form-field"><span class="field-label">错误原因 <span style="color:#adb7c5">· 可多选</span> <span style="color:#df8e8e">*</span></span><div class="form-reasons">${allReasons.map(r=>`<button type="button" class="select-chip ${n.reasons.includes(r)?'selected':''}" data-action="draft-reason" data-id="${esc(r)}" aria-pressed="${n.reasons.includes(r)}">${esc(r)}</button>`).join('')}</div><div class="custom-reason"><input id="custom-reason" maxlength="30" placeholder="其他原因，自己定义" aria-label="自定义错误原因"><button type="button" data-action="add-reason">+ 添加</button></div></div><div class="form-field"><label for="note-date">记录时间</label><input id="note-date" name="createdAt" type="datetime-local" required value="${esc(n.createdAt)}"></div><div class="form-field" style="margin-bottom:0"><label for="note-notes">留一点思路 <span style="color:#adb7c5">· 选填</span></label><textarea id="note-notes" name="notes" maxlength="5000" placeholder="当时哪里没想明白？下次要注意什么？">${esc(n.notes)}</textarea></div></div></div></form></div>`,`<span class="hint">${icon('shield')} 仅保存在这台设备</span><button class="secondary" data-action="cancel-editor">取消</button><button class="primary" form="note-form" type="submit">${icon('check')} 保存到收藏夹</button>`);}
async function saveDraft(){if(busy)return;readDraft();if(!draft.title.trim())return openEditor('给这道错题取一个名字吧。');if(!draft.subject||(!folders.some(f=>f.id===draft.subject)&&draft.subject!=='unfiled'))return openEditor('请选择一个收藏夹，也可以暂存到未分类。');if(!draft.reasons.length)return openEditor('请至少选择一个错误原因。');if(draft.reasons.length>20)return openEditor('最多可以选择 20 个错误原因。');const date=new Date(draft.createdAt);if(!Number.isFinite(date.getTime()))return openEditor('请选择有效的记录时间。');if(date.getTime()>Date.now()+60000)return openEditor('记录时间不能晚于当前时间。');const n={...draft,id:draft.id||crypto.randomUUID(),title:draft.title.trim(),createdAt:date.toISOString()};busy=true;const saveButton=overlay.querySelector('[type="submit"]');if(saveButton){saveButton.disabled=true;saveButton.textContent='正在保存…';}try{await writeNotes([n]);const idx=records.findIndex(r=>r.id===n.id);if(idx>=0)records[idx]=n;else records.push(n);state.demo=false;persistPreference();busy=false;closeModal();navigate('subject',n.subject);toast('已收进'+subjectOf(n.subject).name+'收藏夹');}catch(e){busy=false;showStorageError(e);openEditor('保存未完成，填写的内容已保留。');}}
function findNote(id){return activeRecords().find(n=>n.id===id);}
function openDetail(id){if(imageExportCleanup){imageExportCleanup();imageExportCleanup=null;}const n=findNote(id);if(!n)return;const s=subjectOf(n.subject);modal('回看这道错题',n.example?'这是示例内容，可用来体验查看与分类。':n.mastered?'已经掌握，继续保持。':'慢一点想，把它真正弄明白。',`<div class="modal-content"><div class="editor-layout"><div class="editor-photo">${n.photo?`<img src="${n.photo}" alt="${esc(n.title)}的完整题目照片">`:paper(n)}</div><div><div class="tiny-subject" style="${colors(s)};display:inline-block;margin-bottom:13px">${esc(s.name)}</div><h3 class="detail-title">${esc(n.title)}</h3><div class="detail-info"><span class="field-label">错误原因</span><div class="reason-tags">${n.reasons.map(r=>`<span class="reason-tag">${esc(r)}</span>`).join('')}</div><span class="field-label">思路与反思</span><p class="detail-notes">${esc(n.notes||'还没有留下思路，点击编辑补充吧。')}</p><div class="detail-date">${icon('clock')}${fullLabel(n.createdAt)}</div></div></div></div></div>`,`<button class="secondary" data-action="export-note" data-id="${n.id}">${icon('download')} 导出图片</button>`+(n.example?`<button class="secondary" data-action="close-modal">关闭</button><button class="primary" data-action="copy-example" data-id="${n.id}">以此为模板记录</button>`:`<button class="danger-btn" data-action="delete-confirm" data-id="${n.id}">${icon('trash')} 删除</button><button class="secondary" data-action="edit-note" data-id="${n.id}">${icon('edit')} 编辑</button><button class="primary" data-action="master-note" data-id="${n.id}">${icon(n.mastered?'refresh':'check')}${n.mastered?'设为待复习':'我已掌握'}</button>`));}
async function startCamera(){stopCamera();draft=null;const token=cameraToken;modal('拍下此刻的疑问','将题目放在画面中央，尽量保持清晰。',`<div class="video-area"><div class="camera-state"><div class="spinner"></div>正在开启相机…</div></div><div class="camera-controls"><button class="camera-alternate" data-action="upload">${icon('image')} 从相册选择</button><button class="shutter" data-action="shutter" aria-label="拍摄照片" disabled></button><button class="camera-alternate" data-action="manual">${icon('edit')} 文字记录</button></div><div class="camera-tip">拍摄后先裁切题目，再选择学科与错误原因。</div>`,'','camera-modal');try{if(!navigator.mediaDevices?.getUserMedia)throw new Error('unsupported');const media=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1600},height:{ideal:1200}},audio:false});if(token!==cameraToken){media.getTracks().forEach(t=>t.stop());return;}stream=media;const area=overlay.querySelector('.video-area');area.innerHTML='<video autoplay playsinline muted aria-label="相机预览"></video><div class="camera-guide"></div>';const video=area.querySelector('video');video.srcObject=media;await video.play();if(token===cameraToken)overlay.querySelector('.shutter').disabled=false;}catch(e){if(token!==cameraToken)return;if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}const denied=e.name==='NotAllowedError';const message=denied?(window.AndroidArchive?'请在手机设置 → 应用 → 拾光错题本 → 权限中允许相机，也可以从相册选择照片。':'请在浏览器的网站权限中允许相机，也可以从相册选择照片。'):e.name==='NotFoundError'?'没有检测到相机。你可以上传已经拍好的题目照片。':'暂时无法使用相机。请检查相机是否被其他应用占用，或从相册选择照片。';overlay.querySelector('.video-area').innerHTML=`<div class="camera-state">${icon('camera')}<h3>${denied?'给相机一点权限':'也可以，从一张照片开始。'}</h3><p>${message}</p><button class="primary" data-action="upload">${icon('image')} 从相册选择</button></div>`;}}
function shutter(){const video=overlay.querySelector('video');if(!video?.videoWidth)return toast('相机还没准备好，请稍后再试。');const scale=Math.min(1,3200/Math.max(video.videoWidth,video.videoHeight));const canvas=document.createElement('canvas');canvas.width=Math.round(video.videoWidth*scale);canvas.height=Math.round(video.videoHeight*scale);canvas.getContext('2d').drawImage(video,0,0,canvas.width,canvas.height);const photo=canvas.toDataURL('image/jpeg',.85);stopCamera();beginCrop(photo);}
function choosePhoto(){readDraft();stopCamera();photoRequestId++;document.querySelector('#photo-input').click();}
async function loadPhoto(file){if(!file)return;const request=++photoRequestId;const ownerDraft=draft;if(!file.type.startsWith('image/'))return toast('请选择图片文件。');if(file.size>25*1024*1024)return toast('图片过大，请选择小于 25 MB 的照片。');toast('正在整理照片…');try{const url=URL.createObjectURL(file);const img=new Image();try{await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=()=>reject(new Error('decode'));img.src=url;});if(request!==photoRequestId||draft!==ownerDraft)return;const factor=Math.min(1,3200/Math.max(img.naturalWidth,img.naturalHeight));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.naturalWidth*factor));c.height=Math.max(1,Math.round(img.naturalHeight*factor));const ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(img,0,0,c.width,c.height);const photo=c.toDataURL('image/jpeg',.85);stopCamera();beginCrop(photo);}finally{URL.revokeObjectURL(url);}}catch{if(request===photoRequestId)toast('暂时无法读取这张照片，请转换为 JPG、PNG 或 WebP 后重试。');}}
function confirmDiscard(){readDraft();if(draft&&(draft.title.trim()||draft.notes.trim()||draft.photo||draft.reasons.length)){modal('离开这次记录？','',`<div class="modal-content"><p class="confirm-copy">这道错题还没有保存。离开后，本次填写的内容将被丢弃。</p></div>`,`<button class="secondary" data-action="resume-editor">继续编辑</button><button class="primary" data-action="discard">放弃记录</button>`,'small-modal');}else closeModal();}
function openStorage(){modal('好好保存，每一份积累。','照片和记录保存在当前设备，无需登录即可使用。',`<div class="modal-content"><div class="storage-row"><div><h3>导出备份</h3><p>包含 ${records.length} 道真实错题、收藏夹和自定义话语</p></div><button class="secondary" data-action="export">${icon('download')} 导出</button></div><div class="storage-row"><div><h3>从备份恢复</h3><p>支持新版和旧版拾光 JSON 存档</p></div><button class="secondary" data-action="import">${icon('upload')} 导入</button></div><p class="storage-note">记录保存在当前浏览器或 App 中，可用 JSON 存档迁移到其他设备。导入新版存档时会恢复其中的话语设置。清除浏览器数据或卸载 App 会删除本地记录，请定期导出存档。</p><p class="storage-note">${state.demo?'当前为示例体验模式。示例题目不会混入你的记录，也不会被导出。':'当前正在查看你的真实记录。'}</p></div>`,'','small-modal');}
let archiveBusy = false;
async function exportBackup(){
  if(archiveBusy)return toast('正在导出，请先完成当前保存。');
  const data=createBackup(records,folders,quoteSettings);
  const filename='拾光错题备份-'+localDate()+'.json';
  if(window.AndroidArchive){
    archiveBusy=true;toast('正在准备存档，请选择保存位置…');
    try{const result=await saveAndroidArchive(window.AndroidArchive,filename,data);toast(result.message);}
    catch(error){toast(error.message||'导出失败，请重试。');}finally{archiveBusy=false;}return;
  }
  const url=URL.createObjectURL(new Blob([JSON.stringify(data)],{type:'application/json'}));
  const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),60000);toast('已导出错题、收藏夹和自定义话语');
}
async function readBackup(file){
  if(!file)return;if(file.size>50*1024*1024)toast('正在读取较大的备份，请稍候…');
  try{
    const archive=validateArchive(JSON.parse(await file.text()));restorePending=archive;
    const existing=new Set(records.map(n=>n.id)),updates=archive.notes.filter(n=>existing.has(n.id)).length;
    modal('恢复这份存档？','确认后恢复到当前设备。','<div class="modal-content"><p class="confirm-copy">包含 '+archive.notes.length+' 道错题，将新增 '+(archive.notes.length-updates)+' 道'+(updates?'，并更新 '+updates+' 道相同编号的记录':'')+'。现有其他记录会保留。</p><p class="confirm-copy">'+(archive.version===2?'收藏夹会合并，同编号使用存档中的名称，同名但不同编号会加上“导入”后缀。自定义话语、自动轮换开关和间隔将使用存档中的设置。':'这是一份旧版存档，不包含话语设置；当前自定义话语和收藏夹名称会保留。')+'</p></div>','<button class="secondary" data-action="close-modal">取消</button><button class="primary" data-action="restore-confirm">确认恢复</button>','small-modal');
  }catch(e){toast(e instanceof SyntaxError?'文件内容无法读取，请选择有效的拾光备份。':e.message);}
}
async function restoreBackup(){
  if(!restorePending||busy)return;busy=true;
  try{
    const next=planRestore({notes:records,folders,quoteSettings},restorePending);
    await writeLibrary(db,next);records=next.notes;folders=next.folders;quoteSettings=next.quoteSettings;quoteIndex=0;
    state.demo=false;persistPreference();busy=false;closeModal();navigate('library');toast('存档已恢复，错题与设置都已保存。');
  }catch(e){busy=false;showStorageError(e);}
}

async function saveFolderList(next,message){

}

});
document.addEventListener('submit',e=>{if(e.target.id==='folder-form'){e.preventDefault();addCustomFolder();return;}if(e.target.id==='rename-folder-form'){e.preventDefault();renameFolder(e.target);return;}if(e.target.id==='quote-form'){e.preventDefault();saveQuoteSettings();return;}if(e.target.id==='note-form'){e.preventDefault();saveDraft();}});
document.addEventListener('change',e=>{if(e.target.id==='photo-input'){const f=e.target.files[0];e.target.value='';loadPhoto(f);}if(e.target.id==='restore-input'){const f=e.target.files[0];e.target.value='';readBackup(f);}if(e.target.id==='reason-filter'){state.reason=e.target.value;render();}if(e.target.id==='time-filter'){state.time=e.target.value;render();}if(e.target.id==='timeline-date'&&e.target.value){state.date=e.target.value;render();}});
let searchTimer;
document.addEventListener('input',e=>{if(e.target.id==='custom-quotes'){const line=e.target.value.split(/\r?\n/).find(s=>s.trim());document.querySelector('#quote-preview').textContent=line||'在下面写下你想对自己说的话。';}if(e.target.id==='search-field'){state.query=e.target.value;clearTimeout(searchTimer);searchTimer=setTimeout(()=>{const pos=document.querySelector('#search-field')?.selectionStart;render();const field=document.querySelector('#search-field');field?.focus();if(field?.type==='text')field.setSelectionRange(pos,pos);},160);}});
document.addEventListener('keydown',e=>{if(e.target.id==='custom-reason'&&e.key==='Enter'){e.preventDefault();overlay.querySelector('[data-action="add-reason"]').click();return;}if(e.key==='Escape'&&overlay.innerHTML){if(!busy)(cropCleanup?cancelCrop():draft?confirmDiscard():closeModal());return;}if(e.key==='Tab'&&overlay.innerHTML){const els=[...overlay.querySelectorAll('button:not(:disabled),a[href],input:not(:disabled),textarea,select,[tabindex="0"]')].filter(el=>el.offsetParent!==null);const first=els[0],last=els.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus();}}});
window.addEventListener('pagehide',()=>{stopCamera();clearInterval(quoteTimer);photoRequestId++;});
window.addEventListener('pageshow',()=>syncQuoteRotation());
window.addEventListener('beforeunload',e=>{if(draft){readDraft();if(draft.title||draft.photo||draft.notes){e.preventDefault();e.returnValue='';}}});
async function init(){
  app.innerHTML='<div class="loading"><div class="spinner"></div>正在打开你的错题本…</div>';
  try{
    db=await openDB();records=await readAll();const saved=await readSettings(db);
    if(saved){folders=validateFolders(saved.folders);quoteSettings=normalizeQuoteSettings(saved.quoteSettings);}
    else await writeLibrary(db,{folders,quoteSettings});
    db.onversionchange=()=>{db.close();db=null;storageError='本地数据库已更新，请刷新页面继续使用。';render();};
    try{const pref=localStorage.getItem('shiguang-demo');state.demo=pref==='yes'||(!pref&&records.length===0);}catch{state.demo=records.length===0;}
  }catch(e){storageError='当前无法使用本地存储，暂时可浏览示例。'+(e.message||'请检查设备空间并更新浏览器后重试。');state.demo=true;}
  render();
}
init();

window.shiguangBack=()=>{
  if(busy)return true;
  if(overlay.innerHTML){cropCleanup?cancelCrop():draft?confirmDiscard():closeModal();return true;}
  if(state.page!=='home'){navigate('home');return true;}
  if(state.search){state.search=false;state.query='';render();return true;}
  return false;
};
let resumeCamera=false;
function pauseNativeCamera(){if(stream){stopCamera();resumeCamera=true;}}
function resumeNativeCamera(){if(resumeCamera){resumeCamera=false;if(overlay.querySelector('.camera-modal'))startCamera();}}
window.addEventListener('shiguang-pause',pauseNativeCamera);
window.addEventListener('shiguang-resume',resumeNativeCamera);
window.addEventListener('shiguang-picker-cancelled',()=>{if(!stream&&overlay.querySelector('.camera-modal'))startCamera();});
document.addEventListener('visibilitychange',()=>{if(document.hidden)pauseNativeCamera();else resumeNativeCamera();});

document.querySelector('#photo-input').addEventListener('cancel',()=>{if(!window.AndroidArchive&&!stream&&overlay.querySelector('.camera-modal'))startCamera();});
return {};
})();
})();

</script>
</body>
</html>
